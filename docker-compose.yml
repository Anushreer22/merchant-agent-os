version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: merchant_agent_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: merchant
      POSTGRES_PASSWORD: merchant_password
      POSTGRES_DB: merchant_agent_os
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merchant -d merchant_agent_os"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: